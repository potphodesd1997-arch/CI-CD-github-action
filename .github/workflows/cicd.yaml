name: CICD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - README.md

jobs:
  code:
    uses: ./.github/workflows/code.yaml

  build:
    needs: code
    uses: ./.github/workflows/build.yaml

  test:
    needs: build
    uses: ./.github/workflows/test.yaml

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: prod   # must match input name in deploy.yaml
