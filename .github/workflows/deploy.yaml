name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Code clone
        uses: actions/checkout@v4
      
      - name: Deploy via nginx
        run: cp index.html /var/www/html
        
      - name: Deploy the code
        run: echo "Code Deployed to AWS EC2 instance in ${{ inputs.environment }} environment"
